<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathTextAI - HTML Print Studio</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Navigation Bar */
        .nav-bar {
            background: #ffffff;
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        .nav-link {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            background: #e2e8f0;
            transition: all 0.2s;
        }
        .nav-link:hover { background: #cbd5e1; color: #0f172a; }
        .nav-link.active { background: #2563eb; color: #ffffff; }

        /* Toolbar */
        .toolbar {
            background: #f1f5f9;
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .logo { font-weight: 700; font-size: 1.2rem; color: #0f172a; }
        .logo span { color: #2563eb; }
        .actions { display: flex; gap: 10px; align-items: center; }

        /* Buttons */
        button, .file-upload-label {
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: inline-block;
        }
        .btn-outline { background: #e2e8f0; color: #475569; }
        .btn-outline:hover { background: #cbd5e1; }
        .btn-print { background: #2563eb; color: white; }
        .btn-print:hover { background: #1d4ed8; }
        input[type="file"] { display: none; }

        /* Split Editor Layout (30 / 70) */
        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .pane-left {
            flex: 0 0 30%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e2e8f0;
        }
        .pane-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #cbd5e1;
            padding: 1rem;
            align-items: center;
        }
        .pane-header {
            background: #f8fafc;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #e2e8f0;
        }
        textarea {
            flex: 1;
            width: 100%;
            border: none;
            padding: 1rem;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            background: #ffffff;
            color: #334155;
        }
        .iframe-wrapper {
            flex: 1;
            width: 100%;
            max-width: 8.5in; /* Emulate US Letter paper width */
            background: #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: transparent;
        }

        /* PRINT STYLES */
        @media print {
            .nav-bar, .toolbar, .pane-left, .pane-header { display: none !important; }
            body, .editor-container, .pane-right, .iframe-wrapper { 
                display: block !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                background: white !important; 
                max-width: none !important;
                box-shadow: none !important;
            }
            iframe { height: 100vh !important; width: 100vw !important; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="nav-bar">
        <a href="/" class="nav-link">Docx Converter</a>
        <a href="/print" class="nav-link active">🖨️ HTML Print Studio</a>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="logo">MathTextAI <span>Print Studio</span></div>
        <div class="actions">
            <label class="file-upload-label btn-outline">
                📂 Open HTML
                <input type="file" id="fileInput" accept=".html" onchange="uploadHTML(event)">
            </label>
            <button class="btn-outline" onclick="downloadHTML()">💾 Save HTML</button>
            <button class="btn-print" onclick="printWorksheet()">🖨️ Print / Save as PDF</button>
        </div>
    </div>

    <div class="editor-container">
        <!-- Editor Left Pane -->
        <div class="pane-left">
            <div class="pane-header">Paste & Edit Raw HTML</div>
            <textarea id="htmlInput" oninput="debounceUpdate()" onclick="clearSampleOnce()"></textarea>
        </div>

        <!-- Preview Right Pane -->
        <div class="pane-right">
            <div class="iframe-wrapper">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('htmlInput');
        const iframe = document.getElementById('previewFrame');
        let typingTimer;

        const defaultSample = `<!-- 
===================================================================
MathTextAI - HTML Print Studio Instructions & System Prompt
===================================================================
HOW TO USE:
1. Copy the SYSTEM PROMPT below and paste it into ChatGPT/Gemini 
   along with your lesson, worksheet, or flashcard request.
2. Delete ALL text in this box once you have your AI code.
3. Paste your AI-generated HTML here to preview and edit!

---------------------- COPY SYSTEM PROMPT BELOW ----------------------
Format your response as pure HTML code inside a single block. Do not include intro or outro conversational text.

Follow these strict print & styling rules:
- Paper Size: Design specifically for US Letter paper (8.5in x 11in).
- Page Wrapping: Wrap each page in a container with class "page" (e.g., <section class="page">...</section>).
- Page Breaks: Include "page-break-after: always; break-after: page;" on .page elements so multi-page documents break cleanly.
- Print Margins: Set page padding to 0.5in and enforce "box-sizing: border-box;" on all elements.
- Math Formatting: Use standard LaTeX delimiters ($...$ for inline, $$...$$ for display math) as MathJax is loaded automatically.
----------------------------------------------------------------------
-->

<section class="page">
    <div class="header-fields">
        <div>Name: _______________________</div>
        <div>Date: ____________</div>
    </div>

    <h2>Live Visual Editor Active! 📝</h2>
    <p style="background: #fef3c7; border-left: 4px solid #f59e0b; padding: 12px; font-size: 0.95rem; border-radius: 4px;">
        <strong>Quick Start Guide:</strong><br>
        1. <strong>Copy</strong> the system prompt inside the green comment tag above.<br>
        2. <strong>Paste</strong> it into your AI chat (ChatGPT, Gemini, Claude) with your worksheet topic.<br>
        3. <strong>Delete</strong> this sample code and paste your AI output here.<br>
        4. <strong>Click anywhere on this paper preview</strong> to make quick edits before printing!
    </p>
</section>`;

        function buildDocumentShell(innerContent) {
            return `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        
        @page { size: letter; margin: 0; }
        html, body { margin: 0; padding: 0; }
        
        body { 
            font-family: Arial, sans-serif; 
            color: #000000; 
            line-height: 1.5; 
            outline: none; 
            max-width: 8.5in; 
            margin: 0 auto; 
            background: transparent;
        }
        
        /* Enforce AI page containers to US Letter */
        .page {
            width: 8.5in;
            height: 11in;
            padding: 0.5in;
            margin: 0 auto 12px auto;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            page-break-after: always;
            break-after: page;
        }

        h1, h2 { text-align: center; }
        .header-fields { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        
        table, img, .flashcard { page-break-inside: avoid; break-inside: avoid; }
        
        @media print {
            body { max-width: 100% !important; background: white !important; }
            .page { margin: 0 !important; border: none !important; box-shadow: none !important; }
        }
    </style>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"><\/script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\/script>
</head>
<body contenteditable="true" spellcheck="false">
${innerContent}
</body>
</html>`;
        }

        function debounceUpdate() {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(updatePreview, 300);
        }

        function updatePreview() {
            const frameDoc = iframe.contentDocument || iframe.contentWindow.document;
            frameDoc.open();
            frameDoc.write(buildDocumentShell(textarea.value));
            frameDoc.close();
            frameDoc.body.addEventListener('input', syncLiveEdits);
        }

        function syncLiveEdits() {
            const frameDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (frameDoc && frameDoc.body) {
                textarea.value = frameDoc.body.innerHTML;
            }
        }

        function clearSampleOnce() {
            if (textarea.value.trim() === defaultSample.trim()) {
                textarea.value = '';
                updatePreview();
            }
        }

        function printWorksheet() {
            syncLiveEdits();
            iframe.contentWindow.focus();
            iframe.contentWindow.print();
        }

        function downloadHTML() {
            syncLiveEdits();
            const fullDocument = buildDocumentShell(textarea.value);
            const blob = new Blob([fullDocument], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'MathTextAI_Worksheet.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function uploadHTML(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let content = e.target.result;
                const bodyMatch = content.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
                if (bodyMatch && bodyMatch[1]) {
                    content = bodyMatch[1].trim();
                }
                textarea.value = content;
                updatePreview();
            };
            reader.readAsText(file);
        }

        // Initialize
        textarea.value = defaultSample;
        updatePreview();
    </script>
</body>
</html>
