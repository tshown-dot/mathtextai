<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathTextAI - HTML Print Studio</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f8fafc; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.25rem; color: #0f172a; }
        .container { display: flex; gap: 20px; height: 80vh; }
        textarea { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: monospace; resize: none; }
        iframe { flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
        button { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <header>
        <h1>MathTextAI <span>HTML Print Studio</span></h1>
        <button onclick="document.getElementById('preview').contentWindow.print()">🖨️ Print / Save as PDF</button>
    </header>
    <div class="container">
        <textarea id="code" placeholder="Paste AI HTML here..." oninput="document.getElementById('preview').srcdoc = this.value"></textarea>
        <iframe id="preview"></iframe>
    </div>
</body>
</html>
